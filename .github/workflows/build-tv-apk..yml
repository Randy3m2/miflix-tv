name: Build MiFlix Android TV APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'tv-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiFlix-TV-v1.9.4.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiFlix-TV-v1.9.4
          path: MiFlix-TV-v1.9.4.apk

      - name: Publish test release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tv-v1.9.4"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "MiFlix TV v1.9.4" --notes "Android TV test build. Debug-signed APK for personal testing."
          gh release upload "$TAG" MiFlix-TV-v1.9.4.apk --clobber
