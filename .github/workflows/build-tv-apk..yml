name: Build MiFlix Android TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build MiFlix TV APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiFlix-TV-v1.9.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiFlix-TV-v1.9.4
          path: MiFlix-TV-v1.9.4.apk

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tv-v1.9.4"
          gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "MiFlix TV v1.9.4" \
            --notes "Android TV test build."

          gh release upload "$TAG" MiFlix-TV-v1.9.4.apk --clobber
